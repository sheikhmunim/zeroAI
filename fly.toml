# Fly.io deployment config.
#
# Generated by `flyctl launch` on 2026-08-13, with the explanatory comments
# restored by hand -- `launch` preserves every functional setting from an
# existing fly.toml but strips all comments, which are the only record of why
# these particular numbers were chosen.
#
# Platform choice, decided against measured numbers rather than marketing:
#   image size    2.35 GB
#   steady RSS      729 MB      <- the binding constraint
#   cold start     ~24 s to healthy (locally, multi-threaded)
#   inference     ~112 ms median (locally, Docker Desktop VM)
#
#   Render      Free and Starter tiers are 512 MB. We need 729 MB, so both are
#               out -- the container is OOM-killed mid-load, not merely slow.
#               Standard (2 GB) fits at ~$25/mo: wrong price for a demo.
#   Modal       Serverless, scale-to-zero, best fit for bursty traffic. But it
#               is Python-native -- you define the image in a Python DSL rather
#               than deploying the Dockerfile we wrote, so Stage 4 stops being
#               the thing that ships.
#   HF Spaces   CPU Basic (2 vCPU / 16 GB) is free *hardware*, but a free
#               personal account cannot create a Docker Space at all -- that
#               needs PRO at $9/mo, so it costs MORE than Fly. The free route is
#               a Gradio Space, which means discarding the FastAPI backend this
#               project exists to build.
#   Cloud Run   Scales to zero, takes a Dockerfile, free tier likely covers a
#               demo. Cold-pulling a 2.35 GB image is much slower than Fly's
#               memory-snapshot resume.
#   Fly.io      Deploys this exact Dockerfile unmodified. 1 GB shared-cpu-1x
#               fits 729 MB with headroom. Scale-to-zero drops idle cost to
#               near nothing. `flyctl deploy` is an explicit step in the
#               workflow, so the deploy is legible instead of magic.  <- chosen
#               Cheapest option that keeps the architecture intact.

app = 'zeroai'

# Where the machine physically runs. 'syd' is Sydney.
#
# This is a latency decision, not a capability one -- the same container runs
# identically anywhere. `flyctl launch` defaulted to 'iad' (Virginia), which
# would have added ~250-300 ms of Pacific round-trip to every request on top of
# the ~300-500 ms of single-vCPU inference, making the app feel slow for reasons
# having nothing to do with the model.
#
# Free to change before the first deploy; requires moving the machine after.
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALLOWED_ORIGINS = '*'
  PORT = '8000'
  # shared-cpu-1x is a single vCPU. Left unset, torch sizes its thread pool
  # from the *host's* visible core count and spawns ~8 threads to fight over
  # one core -- slower than single-threaded, and more memory per thread. See
  # Detector.__init__ for the mechanism.
  #
  # Expect latency well above the 112 ms measured locally with multiple
  # threads; single-core inference on shared CPU is realistically 300-500 ms.
  TORCH_THREADS = '1'

[http_service]
  internal_port = 8000
  force_https = true

  # Scale to zero when idle. Explicit tradeoff: idle cost goes to ~$0, but the
  # first request after a suspend pays a cold start. 'suspend' snapshots memory
  # rather than killing the machine, so resume is a few seconds instead of the
  # full ~24 s model load.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    # Inference is CPU-bound and single-threaded here, so requests queue rather
    # than overlap usefully. Low limits make Fly shed or queue load at the edge
    # instead of letting 50 requests pile into one process and all time out.
    hard_limit = 4
    soft_limit = 2

  # Fly's own health probe. Separate from the Dockerfile's HEALTHCHECK, which
  # Fly ignores entirely -- this block is the one that decides whether a deploy
  # is considered successful and whether traffic gets routed.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    # 1 minute is Fly's hard ceiling for an HTTP service check. This was
    # originally 90 s and `flyctl` warned it would be silently lowered:
    #   WARN Service HTTP check has a grace period greater than 1 minute
    #        (1m30s); this will be lowered to 1 minute
    # Written as the real enforced value so the file does not lie about what
    # is running.
    #
    # This is the tightest margin in the deployment. The container needs ~24 s
    # to load CLIP locally with several threads; here it gets one. If startup
    # exceeds 60 s, Fly kills the machine mid-boot and it presents as a crash
    # loop rather than a slow start -- a genuinely misleading symptom. If that
    # happens, the fix is a faster startup (fewer weights to load), not a
    # longer grace period, because there isn't one available.
    grace_period = '1m'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
