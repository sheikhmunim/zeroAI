# GitHub Actions workflow.
#
# The YAML structure, since this is the first one:
#   on:    triggers -- which repository events start a run.
#   jobs:  independent units of work. Each gets a fresh VM ("runner") and they
#          run in parallel unless `needs:` forces an order. Nothing is shared
#          between jobs except what you explicitly upload/download or rebuild.
#   steps: ordered commands inside one job, sharing that job's filesystem.
#          `uses:` runs a prepackaged action; `run:` runs a shell command.
#
# The shape here is a gate: lint, unit tests and a container smoke test all
# have to pass before deploy is allowed to run at all. lint/test/smoke run on
# GitHub's own disposable machines -- nothing broken ever reaches real
# hardware. deploy is the only job that runs on the home server itself, and
# only after the other three are green.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first run still in flight.
# Without this, pushing three times queues three full deploys and they can land
# out of order -- the slowest run finishing last would overwrite newer code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.2
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CLIP's weights are ~600 MB and the tests load them for real. Caching
      # keyed on the checkpoint name turns a 2-minute download into seconds on
      # every run after the first.
      - name: Cache HuggingFace weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-ViT-B-32-laion2b_s34b_b79k

      - name: Install
        run: |
          pip install -r requirements-serve.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pytest==9.1.1

      - name: Unit tests
        run: pytest tests/ -v

  # Separate from `test` because it checks a different class of failure. The
  # unit suite proves the code is right; this proves the *artifact* is
  # deployable. See scripts/smoke_test.py for the list of things that pass
  # pytest and still break in production.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --provenance=false -t detector:ci .

      # -p 8080:8000 deliberately maps a different external port than the
      # container listens on, which is what a real platform does. If the app
      # ever hardcoded 8000 in a URL somewhere, this catches it.
      # --memory-swap is NOT optional here, and leaving it off is what let a
      # production OOM through this check.
      #
      # Keep both numbers roughly in line with what the home server can
      # actually give the container -- see docker-compose.yml.
      - name: Start container
        run: |
          docker run -d --name detector -p 8080:8000 \
            --memory=2g --memory-swap=2g \
            detector:ci

      - name: Smoke test
        run: python scripts/smoke_test.py http://127.0.0.1:8080 --timeout 180

      - name: Container logs on failure
        if: failure()
        run: docker logs detector

      - name: Stop container
        if: always()
        run: docker rm -f detector

  deploy:
    # `needs` is the gate: deploy runs only if all three succeed. Nothing
    # unverified ever reaches the runner sitting on real hardware.
    needs: [lint, test, smoke]
    # ...and only for a real push to main. A pull_request event that happens to
    # target main must never deploy -- otherwise anyone opening a PR from a
    # fork could trigger a run on the self-hosted runner. See the repo's
    # Settings > Actions > "Fork pull request workflows" setting, which should
    # require approval for first-time contributors -- this `if:` is the second
    # layer of the same protection.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # This targets the self-hosted runner registered on the home server,
    # not one of GitHub's disposable machines. `homeserver` is the custom
    # label given to it at registration time (Settings > Actions > Runners).
    runs-on: [self-hosted, homeserver]
    steps:
      # No checkout action here -- the runner already has a persistent clone
      # at ~/homeserver/zeroAI. We just fast-forward it, the same as any
      # other deploy target that isn't rebuilt from a blank VM each time.
      - name: Pull latest code
        run: |
          cd ~/homeserver/zeroAI
          git fetch origin main
          git reset --hard origin/main

      # Compose builds the image and swaps the container over. If the build
      # fails, the previous container just keeps running untouched -- the
      # swap only happens once the new image builds successfully.
      - name: Rebuild and restart container
        run: |
          cd ~/homeserver
          docker compose up -d --build zeroai

      # Same principle as the old Fly step: a green pipeline should mean
      # "actually live and serving", not "the deploy command exited 0".
      # Hits the real public URL through the Cloudflare Tunnel, the same
      # path any real visitor takes.
      - name: Verify production
        run: |
          sleep 5
          python3 scripts/smoke_test.py https://zeroai.sheikhmunim.com --timeout 180